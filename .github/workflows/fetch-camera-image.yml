name: Fetch camera image

on:
  schedule:
    - cron: "*/5 0-6,15-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-camera-image
  cancel-in-progress: false

env:
  CAMERA_IMAGE_URL: https://www.richmond.ca/trafficcam/vdd_oval_river_wb.jpg
  CAMERA_IMAGE_NAME: vdd_oval_river_wb
  DATA_BRANCH: data
  PROCESSED_BRANCH: processed-data

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      in_window: ${{ steps.window.outputs.in_window }}
      timestamp: ${{ steps.capture.outputs.timestamp }}
      captured_at_utc: ${{ steps.capture.outputs.captured_at_utc }}
      captured_at_local: ${{ steps.capture.outputs.captured_at_local }}
      date_path: ${{ steps.capture.outputs.date_path }}
      file_name: ${{ steps.capture.outputs.file_name }}
      raw_path: ${{ steps.capture.outputs.raw_path }}
      processed_path: ${{ steps.capture.outputs.processed_path }}

    steps:
      - name: Check capture window
        id: window
        env:
          TZ: America/Vancouver
        run: |
          hour="$(date +'%H')"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "in_window=true" >> "$GITHUB_OUTPUT"
          elif [ "$hour" -ge 8 ] && [ "$hour" -lt 22 ]; then
            echo "in_window=true" >> "$GITHUB_OUTPUT"
          else
            echo "in_window=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.window.outputs.in_window == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DATA_BRANCH }}

      - name: Set capture timestamp
        if: steps.window.outputs.in_window == 'true'
        id: capture
        env:
          TZ: America/Vancouver
        run: |
          timestamp="$(date +'%Y%m%dT%H%M%S%z')"
          captured_at_utc="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          captured_at_local="$(date +'%Y-%m-%dT%H:%M:%S%:z')"
          date_path="$(date +'%Y-%m-%d')"
          file_name="${CAMERA_IMAGE_NAME}_${timestamp}.jpg"
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"
          echo "captured_at_utc=$captured_at_utc" >> "$GITHUB_OUTPUT"
          echo "captured_at_local=$captured_at_local" >> "$GITHUB_OUTPUT"
          echo "date_path=$date_path" >> "$GITHUB_OUTPUT"
          echo "file_name=$file_name" >> "$GITHUB_OUTPUT"
          echo "raw_path=data/raw/$date_path/$file_name" >> "$GITHUB_OUTPUT"
          echo "processed_path=data/masked/$date_path/$file_name" >> "$GITHUB_OUTPUT"

      - name: Download image
        if: steps.window.outputs.in_window == 'true'
        run: |
          output="${{ steps.capture.outputs.raw_path }}"
          mkdir -p "$(dirname "$output")"
          curl --fail --location --retry 3 --retry-delay 5 \
            --user-agent "GitHubActions/${GITHUB_REPOSITORY}" \
            "$CAMERA_IMAGE_URL" \
            --output "$output"
          test -s "$output"

      - name: Update capture manifest
        if: steps.window.outputs.in_window == 'true'
        run: |
          manifest="data/captures.csv"
          image_id="${{ steps.capture.outputs.date_path }}/${{ steps.capture.outputs.file_name }}"
          if [ ! -f "$manifest" ]; then
            echo "image_id,captured_at_utc,captured_at_local,raw_path" > "$manifest"
          fi
          if ! grep -Fq "$image_id," "$manifest"; then
            echo "$image_id,${{ steps.capture.outputs.captured_at_utc }},${{ steps.capture.outputs.captured_at_local }},${{ steps.capture.outputs.raw_path }}" >> "$manifest"
          fi

      - name: Commit captured image
        if: steps.window.outputs.in_window == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.capture.outputs.raw_path }}" data/captures.csv
          git commit -m "Add camera capture ${{ steps.capture.outputs.timestamp }}"
          git pull --rebase origin "$DATA_BRANCH"
          git push origin "HEAD:$DATA_BRANCH"

  process:
    needs: fetch
    if: needs.fetch.outputs.in_window == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out processing code
        uses: actions/checkout@v6
        with:
          ref: main
          path: code

      - name: Check out raw data
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DATA_BRANCH }}
          path: raw-data

      - name: Check out processed data
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PROCESSED_BRANCH }}
          path: processed-data

      - name: Install processing dependencies
        run: python -m pip install -r code/requirements.txt

      - name: Crop and mask image
        run: |
          python code/src/roi_preprocess.py \
            "raw-data/${{ needs.fetch.outputs.raw_path }}" \
            "processed-data/${{ needs.fetch.outputs.processed_path }}" \
            --config "code/config/field_roi.json" \
            --no-downsample

      - name: Update processed capture manifest
        working-directory: processed-data
        run: |
          manifest="processed_captures.csv"
          image_id="${{ needs.fetch.outputs.date_path }}/${{ needs.fetch.outputs.file_name }}"
          if [ ! -f "$manifest" ]; then
            echo "image_id,timestamp,captured_at_utc,captured_at_local,raw_path,masked_path,predicted_label,confidence,predicted_at" > "$manifest"
          fi
          if ! grep -Fq "$image_id," "$manifest"; then
            echo "$image_id,${{ needs.fetch.outputs.timestamp }},${{ needs.fetch.outputs.captured_at_utc }},${{ needs.fetch.outputs.captured_at_local }},${{ needs.fetch.outputs.raw_path }},${{ needs.fetch.outputs.processed_path }},,," >> "$manifest"
          fi

      - name: Commit processed image
        working-directory: processed-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ needs.fetch.outputs.processed_path }}" processed_captures.csv
          if git diff --cached --quiet; then
            echo "No processed changes to commit"
            exit 0
          fi
          git commit -m "Add processed camera capture ${{ needs.fetch.outputs.timestamp }}"
          git pull --rebase origin "$PROCESSED_BRANCH"
          git push origin "HEAD:$PROCESSED_BRANCH"
